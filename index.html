<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasir Rumah Servis</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Times New Roman', Times, serif, sans-serif;
    }

    body{
      background:#eef1f5;
      padding:20px;
    }

    .app{
      max-width:900px;
      margin:auto;
      display:grid;
      grid-template-columns:1fr 350px;
      gap:20px;
    }

    .card{
      background:white;
      border-radius:15px;
      padding:20px;
      box-shadow:0 5px 15px rgba(0,0,0,0.1);
    }

    h1{
      font-size:28px;
      margin-bottom:10px;
      color:#1d3557;
    }

    h2{
      margin-bottom:15px;
      color:#333;
    }

    .logo{
      display:flex;
      align-items:center;
      gap:10px;
      margin-bottom:20px;
    }

    .logo img{
      width:120px;
      height:120px;
      object-fit:contain;
    }

    .form-group{
      margin-bottom:15px;
    }

    label{
      display:block;
      margin-bottom:5px;
      font-weight:bold;
      color:#444;
    }

    input,
    textarea,
    select{
      width:100%;
      padding:12px;
      border:1px solid #ccc;
      border-radius:8px;
      font-size:14px;
    }

    textarea{
      resize:none;
      height:80px;
    }

    .btn{
      width:100%;
      padding:12px;
      border:none;
      border-radius:10px;
      cursor:pointer;
      font-size:15px;
      font-weight:bold;
      margin-top:10px;
    }

    .btn-print{
      background:#1d3557;
      color:white;
    }

    .btn-print:hover{
      background:#16324f;
    }

    /* STRUK */

    .receipt{
      background:#fafafa;
      border:none;
      padding:10px;
      border-radius:5px;
    }

    .receipt-header{
      text-align:left;
      margin-bottom:15px;
    }

    .receipt-title,
      .subjudul{
      text-align:center;
    }

    .alamat{
      text-align:center;
    }

    .receipt-header img{
       width:70px;
       display:block;
       margin:0 auto;
       margin-bottom:0px;
    }

    .receipt-title{
      font-size:15px;
      font-weight:bold;
      color:#1d3557;
      margin-bottom:5px;
    }

    /* UBAH UKURAN TULISAN DISINI */
    .subjudul{
      font-size:10px;
      font-weight:bold;
      color:#000;
      margin-bottom:5px;
    }

    .alamat{
      font-size:8px;
      color:#333;
    }

    .powered{
       font-size:15px;
       color:#777;
      font-style:italic;
    }

    .line{
      border-top:1px dashed #555;
      margin:10px 0;
    }

    .receipt table{
      width:100%;
      font-size:14px;
    }

    .receipt td{
      padding:5px 0;
      vertical-align:top;
    }

    .total{
      font-size:20px;
      font-weight:bold;
      color:#1d3557;
    }

    .footer{
      text-align:center;
      margin-top:20px;
      font-size:12px;
      color:#555;
    }

    @media print{

      body{
        background:white;
        padding:0;
      }

      @page{
        size:80mm auto;
        margin:2mm;
      }

      body{
        width:60mm;
      }

      .left-panel,
      .btn{
        display:none;
      }

      .app{
        display:block;
      }

      .card{
        box-shadow:none;
        border:none;
      }

      /* isi struk rata kiri */
      .receipt{
        text-align:left;
      }

      /* tabel isi struk */
      .receipt table{
        width:100%;
      }

      .receipt td{
        text-align:left;
        padding:5px 0;
      }

      /* header tetap tengah */
      .receipt-title,
      .subjudul,
      .alamat,
      .footer{
        text-align:center;
      }

      /* logo tetap tengah */
      .receipt-header img{
        display:block;
        margin:0 auto;
      }

    }

    /* Alamat */
        .alamat{
        font-size:12px;
    }

    /* Isi tabel struk */
        .receipt table{
        font-size:13px;
    }

    /* TOTAL */
        .total{
        font-size:15px;
    }

  </style>
</head>

<body>

<div class="app">

  <!-- FORM -->
  <div class="card left-panel">

    <div class="logo">
      <img src="image/logo.png" alt="Logo">

      <div>
        <h1>RUMAH SERVIS</h1>
        <p>Kasir Rumah Servis</p>
      </div>
    </div>

    <h2>Input Data Servis</h2>

    <div class="form-group">
      <label>Teknisi / Kasir</label>
      <input type="text" id="nota" placeholder="Nama teknisi">
    </div>

    <div class="form-group">
      <label>Nama Pelanggan</label>
      <input type="text" id="nama" placeholder="Masukkan nama pelanggan">
    </div>

    <div class="form-group">
      <label>Nomor HP</label>
      <input type="text" id="nomorhp" placeholder="08xxxxxxxxxx">
    </div>

    <div class="form-group">
      <label>Merk HP</label>
      <input type="text" id="merk" placeholder="Samsung / Xiaomi / Oppo">
    </div>

    <div class="form-group">
      <label>Keterangan Kerusakan</label>
      <textarea id="keterangan" placeholder="LCD pecah, baterai drop"></textarea>
    </div>

    <div class="form-group">
      <label>Garansi</label>
      <textarea id="garansi" placeholder="Garansi 1 bulan"></textarea>
    </div>

    <div class="form-group">
      <label>Status</label>

      <select id="status">
        <option>Proses</option>
        <option>Selesai</option>
        <option>Menunggu Sparepart</option>
      </select>
    </div>

    <div class="form-group">
      <label>Biaya Servis</label>
      <input type="number" id="biaya" placeholder="50000">
    </div>

    <button class="btn btn-print" onclick="updateStruk()">
      Update Struk
    </button>

    <button class="btn btn-print" onclick="window.print()">
      Print Struk
    </button>

  </div>

  <!-- STRUK -->
  <div class="card">

    <div class="receipt">

      <div class="receipt-header">

        <img src="image/logo.png" alt="Logo">

        <div class="receipt-title">
          RUMAH SERVIS
        </div>

        <div class="subjudul">
          Servis HP & Jual Beli HP
        </div>

        <div class="alamat">
          Platar, Tahunan, Jepara, Jawa Tengah
        </div>

      </div>

      <div class="line"></div>

      <table>

        <tr>
          <td>Teknisi</td>
          <td>: <span id="r-kasir">-</span></td>
        </tr>

        <tr>
          <td>Tanggal</td>
          <td>: <span id="tanggal"></span></td>
        </tr>

        <tr>
          <td>Nama</td>
          <td>: <span id="r-nama">-</span></td>
        </tr>

        <tr>
          <td>No HP</td>
          <td>: <span id="r-nomorhp">-</span></td>
        </tr>

        <tr>
          <td>Merk HP</td>
          <td>: <span id="r-merk">-</span></td>
        </tr>

        <tr>
          <td>Keterangan</td>
          <td>: <span id="r-keterangan">-</span></td>
        </tr>

        <tr>
          <td>Garansi</td>
          <td>: <span id="r-garansi">-</span></td>
        </tr>

        <tr>
          <td>Status</td>
          <td>: <span id="r-status">-</span></td>
        </tr>

      </table>

      <div class="line"></div>

      <table>

        <tr>
          <td class="total">TOTAL</td>

          <td align="right" class="total" id="r-total">
            Rp 0
          </td>
        </tr>

      </table>

      <div class="line"></div>

      <div class="footer">
        Terima kasih telah menggunakan jasa kami.
      </div>

       <span class="powered">
          By Nauval Hibrizi Hakim
      </span>
      </div>

    </div>

  </div>

</div>

<script>

  // tanggal otomatis
  const today = new Date();

  document.getElementById("tanggal").innerText =
    today.toLocaleDateString("id-ID");

  function updateStruk(){

    const kasir =
      document.getElementById("nota").value;

    const nama =
      document.getElementById("nama").value;

    const nomorhp =
      document.getElementById("nomorhp").value;

    const merk =
      document.getElementById("merk").value;

    const keterangan =
      document.getElementById("keterangan").value;

    const garansi =
      document.getElementById("garansi").value;

    const status =
      document.getElementById("status").value;

    let biaya =
      parseInt(document.getElementById("biaya").value) || 0;

    // tampilkan ke struk

    document.getElementById("r-kasir").innerText =
      kasir || "-";

    document.getElementById("r-nama").innerText =
      nama || "-";

    document.getElementById("r-nomorhp").innerText =
      nomorhp || "-";

    document.getElementById("r-merk").innerText =
      merk || "-";

    document.getElementById("r-keterangan").innerText =
      keterangan || "-";

    document.getElementById("r-garansi").innerText =
      garansi || "-";

    document.getElementById("r-status").innerText =
      status || "-";

    document.getElementById("r-total").innerText =
      "Rp " + biaya.toLocaleString("id-ID");

  }

</script>

</body>
</html>
