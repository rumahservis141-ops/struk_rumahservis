<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kasir Rumah Servis</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Times New Roman', Times, serif;
}

body{
  background:#e5e7eb;
  padding:20px;
}

/* CONTAINER */

.app{
  max-width:900px;
  margin:auto;
  display:grid;
  grid-template-columns:1fr 320px;
  gap:20px;
}

/* CARD */

.card{
  background:white;
  border-radius:15px;
  padding:20px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

/* HEADER */

.logo{
  display:flex;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
}

.logo img{
  width:90px;
  height:90px;
  object-fit:contain;
}

h1{
  font-size:28px;
  color:#1d3557;
}

h2{
  margin-bottom:15px;
  color:#333;
}

/* FORM */

.form-group{
  margin-bottom:15px;
}

label{
  display:block;
  margin-bottom:5px;
  font-weight:bold;
  color:#444;
}

input,
textarea,
select{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:14px;
}

textarea{
  resize:none;
  height:80px;
}

.btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-size:15px;
  font-weight:bold;
  margin-top:10px;
}

.btn-print{
  background:#1d3557;
  color:white;
}

.btn-print:hover{
  background:#16324f;
}

/* STRUK */

.receipt{
  background:#fff;
  padding:15px;
  border-radius:8px;
  width:56mm;
  margin:auto;
  color:#000;
}

.receipt-header{
  text-align:center;
}

.receipt-header img{
  width:150px;
  margin-bottom:2px;
}

.receipt-title{
  font-size:18px;
  font-weight:bold;
  line-height:1.1;
}

.subjudul{
  font-size:15px;
  font-weight:bold;
}

.alamat{
  font-size:12px;
  line-height:1.2;
  color:#444;
}

.line{
  border-top:1px dashed #555;
  margin:8px 0;
}

.receipt table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}

.receipt td{
  padding:3px 0;
  vertical-align:top;
}

.receipt td:first-child{
  width:42%;
}

.total-row td{
  padding-top:6px;
  font-size:16px;
  font-weight:bold;
}

.total-label{
  text-align:left;
}

.total-value{
  text-align:right;
}

.footer{
  text-align:center;
  margin-top:10px;
  font-size:15px;
  line-height:1.4;
  color:#444;
}

.powered{
  display:block;
  margin-top:8px;
  text-align:center;
  font-size:15px;
  color:#666;
  font-style:italic;
}

/* PRINT */

@media print{

  body{
    background:white;
    padding:0;
    margin:0;
  }

  @page{
    size:56mm auto;
    margin:2mm;
  }

  .left-panel,
  .btn{
    display:none;
  }

  .app{
    display:block;
  }

  .card{
    box-shadow:none;
    border:none;
    padding:0;
    margin:0;
  }

  .receipt{
    width:52mm;
    padding:2mm;
    border:none;
  }

}

</style>
</head>

<body>

<div class="app">

  <!-- FORM -->
  <div class="card left-panel">

    <div class="logo">
      <img src="image/logo.png" alt="Logo">

      <div>
        <h1>RUMAH SERVIS</h1>
        <p>Kasir Rumah Servis</p>
      </div>
    </div>

    <h2>Input Data Servis</h2>

    <!-- Teknisi -->
    <div class="form-group">
      <label>Teknisi</label>

      <select id="nota">
        <option value="Farel">Farel</option>
        <option value="Danu">Danu</option>
        <option value="Zazen">Zazen</option>
      </select>
    </div>

    <!-- Nama -->
    <div class="form-group">
      <label>Nama Pelanggan</label>

      <input type="text"
             id="nama"
             placeholder="Masukkan nama pelanggan">
    </div>

    <!-- No HP -->
    <div class="form-group">
      <label>Nomor HP</label>

      <input type="text"
             id="nomorhp"
             placeholder="08xxxxxxxxxx">
    </div>

    <!-- Tipe HP -->
    <div class="form-group">
      <label>Tipe HP</label>

      <input type="text"
             id="merk"
             placeholder="Samsung / Xiaomi / Oppo">
    </div>

    <!-- Kerusakan -->
    <div class="form-group">
      <label>Keterangan Kerusakan</label>

      <textarea id="keterangan"
      placeholder="LCD pecah, baterai drop"></textarea>
    </div>

    <!-- Garansi -->
    <div class="form-group">
      <label>Pilih Garansi</label>

      <select id="group">
        <option>Garansi 1 Minggu</option>
        <option>Garansi 2 Minggu</option>
        <option>Garansi 3 Minggu</option>
        <option>Garansi 1 Bulan</option>
        <option>Tanpa Garansi</option>
      </select>
    </div>

    <!-- Status -->
    <div class="form-group">
      <label>Status</label>

      <select id="status">
        <option>Proses</option>
        <option>Selesai</option>
        <option>Menunggu Sparepart</option>
      </select>
    </div>

    <!-- Biaya -->
    <div class="form-group">
      <label>Biaya Servis</label>

      <input type="number"
             id="biaya"
             placeholder="50000">
    </div>

    <!-- BUTTON -->

    <button class="btn btn-print"
            onclick="updateStruk()">

      Update Struk

    </button>

    <button class="btn btn-print"
            onclick="window.print()">

      Print Struk

    </button>

  </div>

  <!-- STRUK -->
  <div class="card">

    <div class="receipt">

      <!-- HEADER -->

      <div class="receipt-header">

        <img src="image/logo.png" alt="Logo">

        <div class="receipt-title">
          RUMAH SERVIS
        </div>

        <div class="subjudul">
          Servis HP & Jual Beli HP
        </div>

        <div class="alamat">
          Platar, Tahunan, Jepara, Jawa Tengah
        </div>

      </div>

      <div class="line"></div>

      <!-- DATA -->

      <table>

        <tr>
          <td>Teknisi</td>
          <td>: <span id="r-kasir">-</span></td>
        </tr>

        <tr>
          <td>Tanggal</td>
          <td>: <span id="tanggal"></span></td>
        </tr>

        <tr>
          <td>Nama</td>
          <td>: <span id="r-nama">-</span></td>
        </tr>

        <tr>
          <td>No HP</td>
          <td>: <span id="r-nomorhp">-</span></td>
        </tr>

        <tr>
          <td>Tipe HP</td>
          <td>: <span id="r-merk">-</span></td>
        </tr>

        <tr>
          <td>Kerusakan</td>
          <td>: <span id="r-keterangan">-</span></td>
        </tr>

        <tr>
          <td>Garansi</td>
          <td>: <span id="r-garansi">-</span></td>
        </tr>

        <tr>
          <td>Status</td>
          <td>: <span id="r-status">-</span></td>
        </tr>

      </table>

      <div class="line"></div>

      <!-- TOTAL -->

      <table>

        <tr class="total-row">

          <td class="total-label">
            TOTAL
          </td>

          <td class="total-value"
              id="r-total">

            Rp 0

          </td>

        </tr>

      </table>

      <div class="line"></div>

      <!-- FOOTER -->

      <div class="footer">
        Terima kasih telah menggunakan jasa kami.
      </div>

      <span class="powered">
        By Nauval Hibrizi Hakim
      </span>

    </div>

  </div>

</div>

<script>

// TANGGAL

const today = new Date();

document.getElementById("tanggal").innerText =
today.toLocaleDateString("id-ID");

// UPDATE STRUK

function updateStruk(){

  const kasir =
    document.getElementById("nota").value;

  const nama =
    document.getElementById("nama").value;

  const nomorhp =
    document.getElementById("nomorhp").value;

  const merk =
    document.getElementById("merk").value;

  const keterangan =
    document.getElementById("keterangan").value;

  const garansi =
    document.getElementById("group").value;

  const status =
    document.getElementById("status").value;

  let biaya =
    parseInt(document.getElementById("biaya").value) || 0;

  // TAMPILKAN

  document.getElementById("r-kasir").innerText = kasir;
  document.getElementById("r-nama").innerText = nama;
  document.getElementById("r-nomorhp").innerText = nomorhp;
  document.getElementById("r-merk").innerText = merk;
  document.getElementById("r-keterangan").innerText = keterangan;
  document.getElementById("r-garansi").innerText = garansi;
  document.getElementById("r-status").innerText = status;

  document.getElementById("r-total").innerText =
    "Rp " + biaya.toLocaleString("id-ID");

}

</script>

</body>
</html>
